apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-pagamentos
  namespace: compliance-demo
  labels:
    app: api-pagamentos
    owner: compliance
    environment: demo
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-pagamentos
  template:
    metadata:
      labels:
        app: api-pagamentos
        owner: compliance
        environment: demo
        version: v1
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/viniciusevans/projeto-policy-as-code-ada@sha256:383efac7428ef7dce347959150690d0eb11a10dc3ed8093244675fa66dcc76f8
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
