name: Release assinada

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Definir imagem em minusculas
        id: vars
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: Gerar SBOM CycloneDX e SPDX
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          syft "$IMAGE@$DIGEST" -o cyclonedx-json=sbom.cdx.json
          syft "$IMAGE@$DIGEST" -o spdx-json=sbom.spdx.json
      - name: Scan da imagem
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}
          format: json
          output: trivy.json
          exit-code: "0"
          severity: CRITICAL,HIGH
      - name: Assinar imagem e anexar atestacoes
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "$IMAGE@$DIGEST"
          cosign attest --yes --predicate sbom.spdx.json --type spdx "$IMAGE@$DIGEST"
          cosign attest --yes --predicate trivy.json --type vuln "$IMAGE@$DIGEST"
      - name: Verificar assinatura
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            | tee cosign-verify.json
      - name: Metadados e checksums
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "$IMAGE@$DIGEST" > image.txt
          sha256sum sbom.cdx.json sbom.spdx.json trivy.json cosign-verify.json image.txt > checksums.sha256
      - name: Publicar artefatos do workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ github.ref_name }}
          path: |
            sbom.cdx.json
            sbom.spdx.json
            trivy.json
            cosign-verify.json
            image.txt
            checksums.sha256
      - name: Publicar arquivos no GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes \
            sbom.cdx.json sbom.spdx.json trivy.json cosign-verify.json image.txt checksums.sha256

  provenance:
    needs: build-sign-attest
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build-sign-attest.outputs.image }}
      digest: ${{ needs.build-sign-attest.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
